name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, typecheck, and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported release line (https://nodejs.org/en/about/previous-releases).
          # 22 is tested as 22.0.0, the oldest Node the package supports (engines: >=22).
          # The dev tools (vitest's rolldown) need 22.12+ to install, so install
          # with the latest 22, then run everything on 22.0.0.
          - node: "22"
            version: "22.0.0"
            install-node: "22"
          - node: "24"
            version: "24"
            install-node: "24"
          - node: "26"
            version: "26"
            install-node: "26"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.install-node }} (install)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.install-node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Switch to Node.js ${{ matrix.version }}
        if: matrix.version != matrix.install-node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.version }}

      - name: Show Node.js version
        run: node --version

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Smoke-test built CLI
        run: ./dist/skill-library --version

      # The e2e image, with its apt and npm ci layers cached between runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build end-to-end image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/e2e/Dockerfile
          build-args: NODE_VERSION=${{ matrix.install-node }}
          tags: skill-library-e2e
          load: true
          cache-from: type=gha,scope=e2e-node${{ matrix.install-node }}
          cache-to: type=gha,mode=max,scope=e2e-node${{ matrix.install-node }}

      # In a throwaway Docker container without network (scripts/e2e.mjs), on this job's Node line.
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          E2E_IMAGE_BUILT: "1"

  e2e-live:
    name: End-to-end tests against the real services
    runs-on: ubuntu-latest
    # Real services and a real model: a failure is reported on the run, but never blocks a merge.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build end-to-end image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/e2e/Dockerfile
          build-args: NODE_VERSION=24
          tags: skill-library-e2e
          load: true
          cache-from: type=gha,scope=e2e-node24

      # Real GitHub and skills.sh (read-only), and the real TypeSafe API with the repository secret.
      # Pull requests from forks get no secrets: the TypeSafe test is then skipped.
      - name: Run live end-to-end tests
        run: npm run test:e2e:live
        env:
          E2E_IMAGE_BUILT: "1"
          SKILL_LIBRARY_TYPESAFE_API_KEY: ${{ secrets.SKILL_LIBRARY_TYPESAFE_API_KEY }}
