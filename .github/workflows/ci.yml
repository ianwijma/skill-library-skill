name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, typecheck, and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported release line (https://nodejs.org/en/about/previous-releases),
          # plus 22.0.0: the oldest Node the package supports (engines: >=22).
          # The dev tools (vitest's rolldown) need 22.12+ to install, so install
          # with the latest 22, then run everything on 22.0.0.
          - node: "22.0.0"
            install-node: "22"
          - node: "22"
            install-node: "22"
          - node: "24"
            install-node: "24"
          - node: "26"
            install-node: "26"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.install-node }} (install)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.install-node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Switch to Node.js ${{ matrix.node }}
        if: matrix.node != matrix.install-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show Node.js version
        run: node --version

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Smoke-test built CLI
        run: ./dist/skill-library --version
